<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" width="1200" height="18" role="presentation">
  <defs>
    <linearGradient id="lineBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <style>
      .beam { animation: slide 4.2s linear infinite; }
      @keyframes slide {
        0% { transform: translateX(-280px); }
        100% { transform: translateX(1260px); }
      }
    </style>
  </defs>
  <rect x="0" y="8" width="1200" height="2" rx="1" fill="url(#lineBase)"/>
  <rect class="beam" x="0" y="7" width="240" height="4" rx="2" fill="url(#pulseBeam)"/>
</svg>
